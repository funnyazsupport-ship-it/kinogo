name: iOS build

# Builds the iOS app on a macOS runner (iOS cannot be built on Windows/Linux).
# By default it produces an UNSIGNED .app (no Apple account needed), which is
# enough to confirm the project compiles for iOS. To get an installable .ipa,
# set up code signing (see the commented "signed-ipa" job and the README).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-unsigned:
    name: Build (unsigned .app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      # Wrap the .app into an UNSIGNED .ipa. This cannot be installed directly,
      # but sideloading tools (AltStore / SideStore / Sideloadly) sign it on
      # your device with a FREE Apple ID at install time — no paid account.
      - name: Package unsigned .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -y kinogo-unsigned.ipa Payload
          ls -lh kinogo-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: kinogo-unsigned-ipa
          path: build/ios/iphoneos/kinogo-unsigned.ipa
          if-no-files-found: error

